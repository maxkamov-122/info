<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBROXIM PC SHOP - Taplink</title>
    <!-- Ikonkalar uchun Font Awesome -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Orbitron', 'Segoe UI', sans-serif; /* Geymerlarbop shrift varianti */
        }

        body {
            background-color: #05070b;
            /* Orqa fonda mayda kiber-to'r (matrix grid) effekti */
            background-image: 
                linear-gradient(rgba(0, 242, 254, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 242, 254, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 25px 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            text-align: center;
        }

        /* Logo qismi */
        .logo-wrapper {
            margin-bottom: 30px;
        }

        .main-logo {
            width: 180px; /* Logotip sifatli va aniq ko'rinishi uchun o'lcham */
            height: auto;
            filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.3)); /* Logotip atrofida och ko'k neon jilosi */
            margin-bottom: 10px;
        }

        /* Neon Effektli Tugmalar */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 35px;
        }

        .neon-btn {
            display: flex;
            align-items: center;
            background: rgba(10, 15, 26, 0.8); /* To'q shaffof fon */
            color: #ffffff;
            text-decoration: none;
            padding: 16px 20px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            
            /* Neon kiber-chegara effekti */
            border: 2px solid #00f2fe;
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.2), inset 0 0 10px rgba(0, 242, 254, 0.1);
            
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Tugma ustiga sichqoncha kelganda (Hover) */
        .neon-btn:hover {
            color: #05070b;
            background: #00f2fe; /* Tugma ichi neon ko'k rangga to'ladi */
            box-shadow: 0 0 25px #00f2fe, 0 0 50px #00f2fe;
            transform: translateY(-3px);
        }

        /* Ikonkalar uslubi */
        .neon-btn i {
            font-size: 22px;
            width: 35px;
            text-align: left;
            color: #00f2fe;
            transition: color 0.3s ease;
        }

        .neon-btn:hover i {
            color: #05070b; /* Hover bo'lganda ikonka rangi ham qorayadi */
        }

        .neon-btn span {
            flex-grow: 1;
            text-align: center;
            padding-right: 35px; /* Matn markazda turishini ta'minlash uchun */
        }

        /* Pastki qism */
        .footer-area {
            font-size: 12px;
            letter-spacing: 2px;
            color: #4f6173;
            text-transform: uppercase;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .footer-icon {
            font-size: 18px;
            color: #00f2fe;
            animation: spin 4s linear infinite; /* Pastdagi shesternya aylanib turishi uchun */
        }

        @keyframes spin {
            100% { transform: rotate(30deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Logotip bo'limi -->
        <div class="logo-wrapper">
            <!-- logo_ibroxim.png o'rniga haqiqiy rasm manzili yoki nomini qo'yasiz -->
            <img src="logo_ibroxim.png" alt="IBROXIM PC SHOP Logo" class="main-logo">
        </div>

        <!-- Neon Tugmalar -->
        <div class="links-container">
            
            <!-- Instagram -->
            <a href="https://www.instagram.com/ibroximpcshop/reels/" target="_blank" class="neon-btn">
                <i class="fab fa-instagram"></i>
                <span>Instagram</span>
            </a>

            <!-- Telegram Kanal -->
            <a href="https://t.me/ibroximpcshop" target="_blank" class="neon-btn">
                <i class="fab fa-telegram-plane"></i>
                <span>Telegram Kanal</span>
            </a>

            <!-- YouTube (Obzorlar) -->
            <a href="https://youtube.com" target="_blank" class="neon-btn">
                <i class="fab fa-youtube"></i>
                <span>YouTube Obzorlar</span>
            </a>

            <!-- Buyurtma berish / Admin -->
            <a href="https://t.me/maxkamov_pc" target="_blank" class="neon-btn">
                <i class="fas fa-shopping-cart"></i>
                <span>Kompyuter yig'ish</span>
            </a>

            <!-- Bizning Manzil -->
            <a href="https://www.google.com/maps/place/41%C2%B007'09.5%22N+69%C2%B003'19.4%22E/@41.118636,69.0549439,17.75z/data=!4m4!3m3!8m2!3d41.119297!4d69.055394?entry=ttu&g_ep=EgoyMDI2MDkwMi4wIKXMDSoASAFQAw%3D%3D" target="_blank" class="neon-btn">
                <i class="fas fa-map-marker-alt"></i>
                <span>Do'kon manzili</span>
            </a>

        </div>

        <!-- Pastki qism sozlari -->
        <div class="footer-area">
            <div>Sifat • Ishonch • Tezkorlik</div>
            <i class="fas fa-cog footer-icon"></i>
        </div>

    </div>

</body>
</html>
